server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /health {
        default_type text/plain;
        access_log off;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer-when-downgrade always;
    }
}
